- name: Ensure Docker service is running
  service:
    name: docker
    state: started
    enabled: yes

- name: Run Spring Boot application container
  community.docker.docker_container:
    name: "{{ container_name }}"
    image: "{{ docker_image }}"
    state: started
    restart_policy: unless-stopped
    published_ports:
      - "{{ host_port }}:{{ container_port }}"
  notify: Restart application
